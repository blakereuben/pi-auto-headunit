# Installed as /etc/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# — deliberately the SAME filename as Raspberry Pi OS's own vendor
# drop-in (/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf,
# Storage=volatile), not a uniquely-named one. Real-hardware finding
# (2026-08-18, docs/development/appliance-recovery.md): a differently-
# named /etc drop-in setting Storage=persistent did NOT reliably take
# effect even though `systemd-analyze cat-config` showed it as the
# last-applied value — only shadowing the vendor file by exact filename,
# confirmed directly, reliably switched the running daemon's storage
# mode (after `journalctl --flush`, run once by postinst — a plain
# `systemctl restart systemd-journald` alone was not enough in testing).
#
# Persistent, not volatile: a crashed boot's logs need to survive the
# reboot to be diagnosable at all — real-hardware finding, same session:
# the M5 appliance kiosk service hard-hung this board multiple times,
# and every one of those crashes' logs were unrecoverable until this
# override was applied. See appliance-recovery.md for the full
# incident.
#
# Bounded, not unlimited: ARCHITECTURE.md §8 calls for "structured,
# redacted" logging generally and the M5 checklist specifically for
# "bounded journald logging" — an appliance with no operator watching
# disk usage should never be able to fill its own storage with logs.
# 200M/100M are a reasoned starting point for a small embedded device,
# not measured against a specific storage size — revisit if a real
# device's storage is meaningfully smaller or larger than this
# development Pi's.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=100M
MaxRetentionSec=30day
