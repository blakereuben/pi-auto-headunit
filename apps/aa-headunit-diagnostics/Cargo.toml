[package]
name = "aa-headunit-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
media-api = { path = "../../crates/media-api" }
media-gstreamer = { path = "../../crates/media-gstreamer" }
platform-api = { path = "../../crates/platform-api" }
platform-linux = { path = "../../crates/platform-linux" }
transport-api = { path = "../../crates/transport-api" }
transport-tcp = { path = "../../crates/transport-tcp" }
transport-usb = { path = "../../crates/transport-usb" }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
credential-store = { path = "../../crates/credential-store" }
ctrlc = "3"
nix = { version = "=0.29.0", default-features = false, features = ["process"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk4 = { version = "0.10.3", features = ["v4_10"] }
protocol-aap = { path = "../../crates/protocol-aap" }
rtnetlink = "0.23.0"
security-openssl = { path = "../../crates/security-openssl" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "0.9"
transport-bluetooth = { version = "0.1.0", path = "../../crates/transport-bluetooth" }

[lints]
workspace = true
