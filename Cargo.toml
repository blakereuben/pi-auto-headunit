[workspace]
resolver = "2"
members = [
    "apps/aa-headunit-diagnostics",
    "crates/media-api",
    "crates/media-gstreamer",
    "crates/platform-api",
    "crates/platform-linux",
    "crates/protocol-aap",
    "crates/transport-api",
    "crates/transport-usb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/blakereuben/pi-auto-headunit"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
